function itemCount(n){return n+' '+(n===1?'item':'items')}
function variant(id){for(const p of products){const v=p.variants.find(v=>v.id===id);if(v)return{p,v}}throw Error('Unknown variant')}
function available(v){return Math.min(...Object.entries(v.recipe).map(([id,q])=>Math.floor(stock.find(s=>s.id===id).qty/q)))}
function total(){return cart.reduce((sum,l)=>sum+variant(l.variantId).v.price*l.qty,0)}
function demand(){const out={};cart.forEach(l=>Object.entries(variant(l.variantId).v.recipe).forEach(([id,q])=>out[id]=(out[id]||0)+q*l.qty));return out}
function shortage(){return Object.entries(demand()).find(([id,q])=>stock.find(s=>s.id===id).qty<q)}
function notify(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,4500)}
function badge(text,type=''){return `<span class="badge ${type}">${escapeHTML(text)}</span>`}
function footer(){return '<footer class="review-footer"><span>Design review · synthetic data · changes reset when reloaded</span><span>Modern POS / Design refinement 0.2</span></footer>'}
function heading(title,subtitle,action=''){return `<div class="heading"><div><div class="eyebrow" style="margin-bottom:10px">${page==='cashier'?'Counter 01':'Back office'}</div><h1>${title}</h1><p>${subtitle}</p></div>${action||'<div class="title-note">Demo outlet<br>Connected workspace</div>'}</div>`}
function render(){
 const active=document.activeElement;
 const focusData=active?.dataset?.qty?{qty:active.dataset.qty,delta:active.dataset.delta}:active?.dataset?.category?{category:active.dataset.category}:active?.dataset?.product?{product:active.dataset.product}:null;
 document.body.dataset.page=page;
 $('#nav').innerHTML=navItems.map(([id,symbol,label])=>`<button class="nav-button" data-page="${id}" ${page===id?'aria-current="page"':''}><span class="nav-symbol" aria-hidden="true">${icon(symbol)}</span><span>${label}</span></button>`).join('');
 $('#platform-label').textContent=page==='cashier'?'Flutter cashier':'Web back office';$('#connection-status').className='connection'+(online?'':' offline');$('#connection-status').innerHTML=`<span class="dot"></span>${online?'Connected':'Offline'}`;$('#offline-banner').hidden=online;
 $('#mobile-order').hidden=page!=='cashier'||screenState!=='ready';
 if(screenState!=='ready'){const states={loading:['Getting things ready','Loading your workspace…','Restore ready state'],empty:['Nothing here yet','Your workspace is ready for its first record.','Explore demo data'],error:['Couldn’t load this screen','Your existing records are safe. Try loading again.','Try again']};const [title,copy,action]=states[screenState];$('#main').innerHTML=heading(navItems.find(n=>n[0]===page)[2],'Preview the screen states.')+`<section class="state-panel" ${screenState==='error'?'role="alert"':'role="status"'}><div class="state-symbol" aria-hidden="true">${screenState==='error'?'!':screenState==='empty'?'○':'…'}</div><h2>${title}</h2><p>${copy}</p><button class="primary" data-action="ready">${action}</button></section>`+footer();return}
 const draw={cashier:cashierScreen,menu:menuScreen,stock:stockScreen,reports:reportsScreen,printers:printerScreen};$('#main').innerHTML=draw[page]()+footer();
 const count=cart.reduce((n,l)=>n+l.qty,0),summary=itemCount(count)+', total '+money(total());
 $('#mobile-order').hidden=page!=='cashier'||screenState!=='ready';
 $('#mobile-order-count').textContent=itemCount(count);$('#mobile-order-total').textContent=money(total());
 if(summary!==lastCartAnnouncement){$('#order-announcement').textContent=summary;lastCartAnnouncement=summary}
 if(focusData){const selector=focusData.qty?'[data-qty="'+CSS.escape(focusData.qty)+'"][data-delta="'+focusData.delta+'"]':focusData.category?'[data-category="'+CSS.escape(focusData.category)+'"]':'[data-product="'+CSS.escape(focusData.product)+'"]';document.querySelector(selector)?.focus({preventScroll:true})}

}
function cashierScreen(){const visible=products.filter(p=>(category==='All items'||p.category===category)&&p.name.toLowerCase().includes(search.toLowerCase()));return heading('New sale','Select items, review the order, and record a sale.')+`<div class="cashier-layout"><section aria-label="Product catalog"><div class="search-row"><label class="search">${icon('search')}<input id="search" aria-label="Search menu" placeholder="Search the menu" value="${escapeHTML(search)}"><span class="kbd" aria-hidden="true">⌘ K</span></label><span class="muted small">${products.length} items</span></div><div class="chips" role="group" aria-label="Product category">${['All items','Coffee','Bakery'].map(c=>`<button class="chip ${category===c?'active':''}" aria-pressed="${category===c}" data-category="${c}">${c}</button>`).join('')}</div><div class="product-grid">${visible.map(p=>{const v=p.variants[0],count=Math.max(...p.variants.map(available));return `<button class="product" data-product="${p.id}" ${count===0?'disabled':''} aria-label="Add ${p.name}${p.variants.length>1?', choose size':''}${count===0?', out of stock':''}"><div class="product-art ${p.category.toLowerCase()}"><span class="product-illustration">${icon(productIcon(p))}</span></div><div class="product-detail"><span class="eyebrow">${p.category}</span><strong>${p.name}</strong><span class="stock-label">${count?`${count} available${p.variants.length>1?' · 2 sizes':''}`:'Out of stock'}</span><div class="bottom"><span class="num">${p.variants.length>1?'From ':''}${money(v.price)}</span><span class="plus-box" aria-hidden="true">${icon('plus')}</span></div></div></button>`}).join('')||'<p class="muted">No matching items. Try another search.</p>'}</div></section><aside class="cart-panel" id="current-order" aria-label="Current order" tabindex="-1"><div class="cart-title"><div><h2>Current order</h2><p>Counter sale · ${itemCount(cart.reduce((n,l)=>n+l.qty,0))}</p></div>${badge('Draft','neutral')}</div><div class="cart-lines">${cart.length?cart.map(l=>{const{p,v}=variant(l.variantId);return `<div class="cart-line"><div class="cart-line-top"><div><strong>${p.name}</strong><p>${v.name} · ${money(v.price)}</p></div><strong class="num">${money(v.price*l.qty)}</strong></div><div class="cart-line-actions"><div class="stepper"><button data-qty="${v.id}" data-delta="-1" aria-label="Decrease ${p.name} quantity">${icon('minus')}</button><span class="num">${l.qty}</span><button data-qty="${v.id}" data-delta="1" aria-label="Increase ${p.name} quantity">${icon('plus')}</button></div><button class="quiet remove" data-remove="${v.id}" aria-label="Remove ${p.name}">${icon('x')}</button></div></div>`}).join(''):'<div class="cart-empty">Your order starts here.<br><span class="small">Choose an item from the menu.</span></div>'}</div><div class="cart-totals"><div class="total-row muted"><span>Subtotal</span><span class="num">${money(total())}</span></div><div class="total-row muted small"><span>Tax & service · demo 0%</span><span>${money(0)}</span></div><div class="total-row big"><span>Total</span><span class="num">${money(total())}</span></div><button class="primary" data-action="checkout" ${!cart.length||!online?'disabled':''}><span>${online?'Continue to payment':'Reconnect to continue'}</span>${icon('arrow-right')}</button><p class="cart-footnote">Stock updates when a sale is recorded.</p></div></aside></div>`}
function menuScreen(){return heading('Your menu','A simple home for every item you sell.',badge('5 demo items','neutral'))+`<section class="panel"><div class="panel-head"><div><h2>Menu items</h2><p class="muted small">Products, variants and linked stock</p></div><span class="muted small">Select Edit to explore</span></div><table class="data-table"><thead><tr><th style="width:34%">Item</th><th>Category</th><th>Price</th><th>Availability</th><th style="width:90px">Action</th></tr></thead><tbody>${products.map(p=>`<tr><td><div class="item-name"><span class="mini-art">${icon(productIcon(p))}</span><div><strong>${p.name}</strong><p>${p.variants.length} variant${p.variants.length>1?'s':''} · stock tracked</p></div></div></td><td data-label="Category">${p.category}</td><td data-label="From" class="num">${money(p.variants[0].price)}</td><td>${available(p.variants[0])?badge('Available'):badge('Out of stock','danger')}</td><td><button class="table-action" data-edit="${p.id}" aria-label="Edit ${p.name}">Edit</button></td></tr>`).join('')}</tbody></table></section><p class="info-line">Tracked items consume linked ingredients or finished goods. Recipe authoring is a separate implementation ticket.</p>`}
function stockScreen(){return heading('Stock overview','On-hand quantities and the movements behind them.')+`<div class="summary-strip"><div><span class="muted small">Stock items</span><div class="value num">${stock.length}</div></div><div><span class="muted small">Low or out of stock</span><div class="value num">${stock.filter(s=>s.qty<=s.threshold).length}</div></div><div><span class="muted small">Demo movements</span><div class="value num">${movements.length}</div></div></div><section class="panel"><div class="panel-head"><div><h2>Inventory</h2><p class="muted small">Quantities in base units</p></div>${badge('Live demo')}</div><table class="data-table"><thead><tr><th style="width:32%">Stock item</th><th>On hand</th><th>Threshold</th><th>Status</th><th style="width:100px">Action</th></tr></thead><tbody>${stock.map(s=>`<tr><td><strong>${s.name}</strong><p>Linked to menu</p></td><td data-label="On hand" class="num">${s.qty.toLocaleString('en')} ${s.unit}</td><td data-label="Threshold" class="num">${s.threshold.toLocaleString('en')} ${s.unit}</td><td>${s.qty===0?badge('Out of stock','danger'):s.qty<=s.threshold?badge('Low stock','warning'):badge('In stock')}</td><td><button class="table-action" data-adjust="${s.id}" aria-label="Adjust ${s.name}">Adjust</button></td></tr>`).join('')}</tbody></table></section>${movements.length?`<section class="panel" style="margin-top:24px"><div class="panel-head"><h2>Recent movements</h2></div><div class="panel-body">${movements.slice(-6).reverse().map(m=>`<div class="receipt-line"><span>${escapeHTML(m.name)}<br><span class="muted small">${escapeHTML(m.reason)}</span></span><strong class="num">${m.delta>0?'+':''}${m.delta} ${m.unit}</strong></div>`).join('')}</div></section>`:''}`}
function reportsScreen(){const filtered=sales.filter(s=>s.date===reportDate),gross=filtered.reduce((n,s)=>n+s.total,0),count=filtered.length;return heading('Sales overview','Sales from this demo session. Figures update after checkout.',`<button data-action="export">Export CSV ↓</button>`)+`<div class="search-row"><label class="field"><span>Report date · Asia/Jakarta</span><input id="report-date" type="date" value="${reportDate}"></label><span class="small muted">Current session only</span></div><section class="report-metrics" aria-label="Sales summary"><div class="metric"><span class="muted">Net item sales</span><div class="value num">${money(gross)}</div><p>No reversals or charges in this demo</p></div><div class="metric"><span class="muted">Recorded sales</span><div class="value num">${count}</div><p>Completed counter sales</p></div><div class="metric"><span class="muted">Average bill</span><div class="value num">${money(count?gross/count:0)}</div><p>Gross item sales ÷ sale count</p></div></section><div class="report-layout"><section class="panel"><div class="panel-head"><h2>Recent sales</h2>${badge('Session','neutral')}</div>${count?`<div class="panel-body">${filtered.slice().reverse().map(s=>`<div class="receipt-line"><div><strong>${s.reference}</strong><p class="small muted">${s.kind==='CASH'?'Cash':'Manual external'} · Recorded</p></div><div><strong class="num">${money(s.total)}</strong><br><button class="table-action" data-receipt="${s.id}" aria-label="View receipt ${s.reference}">View receipt</button></div></div>`).join('')}</div>`:'<div class="panel-body"><h2>No recorded sales yet</h2><p class="muted" style="margin:8px 0 20px">Complete a demo checkout to see the connected report.</p><button data-page="cashier">Open cashier</button></div>'}</section><section class="panel"><div class="panel-head"><h2>Payment breakdown</h2></div><div class="panel-body">${['CASH','MANUAL_EXTERNAL'].map(kind=>{const n=filtered.filter(s=>s.kind===kind).reduce((a,s)=>a+s.total,0);return `<div class="payment-row"><div class="receipt-line"><span>${kind==='CASH'?'Cash':'Manual external'}</span><strong class="num">${money(n)}</strong></div><div class="report-bar" aria-label="${kind==='CASH'?'Cash':'Manual external'} share ${gross?Math.round(n/gross*100):0}%"><span style="width:${gross?n/gross*100:0}%"></span></div></div>`}).join('')}<p class="small muted" style="margin-top:16px">Manual external records do not verify or process a payment.</p></div></section></div>`}
function printerScreen(){return heading('Printers','A separate step. Your sale stays safe if printing fails.')+`<div class="printer-layout"><section class="panel"><div class="panel-head"><div><h2>Receipt printer</h2><p class="muted small">Simulated connection for design review</p></div>${printer.ready?badge('Demo ready'):badge('Not connected','neutral')}</div><form id="printer-form" class="panel-body"><div class="form-grid"><label class="field full"><span>Printer name</span><input name="printerName" required maxlength="100" value="${escapeHTML(printer.name)}"></label><label class="field full"><span>Model</span><input name="model" required maxlength="100" value="${escapeHTML(printer.model)}"></label><label class="field"><span>Connection</span><select name="transport">${['Bluetooth','LAN','USB'].map(t=>`<option ${printer.transport===t?'selected':''}>${t}</option>`).join('')}</select></label><label class="field"><span>Paper width</span><select name="width"><option value="80" ${printer.width==='80'?'selected':''}>80 mm</option><option value="58" ${printer.width==='58'?'selected':''}>58 mm</option></select></label></div><div class="actions" style="margin-top:24px"><button class="primary" type="submit">Save settings</button><button type="button" data-action="test-print">Simulate test print</button></div><div class="help-box">These controls simulate printer behavior. Actual Bluetooth, LAN and USB support depends on verified hardware under ticket #15.</div><label class="choice" style="margin-top:16px"><input type="checkbox" id="print-fail" ${printer.fail?'checked':''}>Simulate printer failure <span class="muted small">Review only</span></label></form></section><section class="panel"><div class="panel-head"><h2>Receipt preview</h2></div><div class="printer-illustration"><div class="receipt-title"><strong>DEMO OUTLET</strong><br>Counter 01<br><span class="small">Sample receipt · ${printer.width} mm</span></div><div class="receipt-line"><span>Flat white × 1</span><span>28.000</span></div><div class="receipt-line"><span>Croissant × 1</span><span>24.000</span></div><hr style="border:0;border-top:1px dashed var(--border);margin:16px 0"><div class="receipt-line"><strong>TOTAL</strong><strong>52.000</strong></div><p style="text-align:center;margin-top:20px">Thank you. See you soon.</p></div></section></div>`}
function openDialog(title,subtitle,content,actions=''){lastOpener=document.activeElement;$('#dialog').innerHTML=`<div class="dialog-content"><div class="dialog-head"><div><h2 id="dialog-title">${title}</h2><p>${subtitle}</p></div><button class="dialog-close quiet" data-action="close-dialog" aria-label="Close dialog">${icon('x')}</button></div>${content}${actions?`<div class="dialog-actions">${actions}</div>`:''}</div>`;$('#dialog').showModal()}
function closeDialog(){if($('#dialog').open)$('#dialog').close();if(lastOpener&&lastOpener.isConnected)lastOpener.focus();else $('#main').focus()}
function addVariant(id){const entry=cart.find(l=>l.variantId===id);if(entry)entry.qty++;else cart.push({variantId:id,qty:1});const tooMuch=shortage();if(tooMuch){if(entry)entry.qty--;else cart.pop();notify('Not enough linked stock for that quantity.');return}render();notify('Added to order.')}
function chooseProduct(id){const p=products.find(p=>p.id===id);if(p.variants.length===1){addVariant(p.variants[0].id);return}openDialog(p.name,'Choose a size for this order.',`<div class="choice-list">${p.variants.map(v=>`<button data-variant="${v.id}" ${available(v)===0?'disabled':''} style="display:flex;justify-content:space-between"><span>${v.name} <span class="muted small">${available(v)} available</span></span><span class="num">${money(v.price)}</span></button>`).join('')}</div>`)}
function editMenu(id){const p=products.find(p=>p.id===id);openDialog('Edit menu item','Changes update the demo catalog. Historical receipts stay unchanged.',`<form id="menu-form" data-id="${id}" novalidate><div id="form-error" class="form-error" role="alert"></div><div class="form-grid"><label class="field full"><span>Item name</span><input name="name" value="${escapeHTML(p.name)}" maxlength="100" required></label><label class="field full"><span>Category</span><select name="category"><option ${p.category==='Coffee'?'selected':''}>Coffee</option><option ${p.category==='Bakery'?'selected':''}>Bakery</option></select></label>${p.variants.map(v=>`<label class="field"><span>${v.name} price · IDR</span><input name="price-${v.id}" inputmode="numeric" type="number" step="1" min="0" value="${v.price}" required></label>`).join('')}<div class="field full"><span>Stock policy</span><div class="help-box" style="margin:0">Tracked · ${Object.entries(p.variants[0].recipe).map(([id,q])=>{const s=stock.find(s=>s.id===id);return `${q} ${s.unit} ${s.name}`}).join(' + ')} per ${p.variants[0].name.toLowerCase()} item.<br>Recipe editing will be implemented in ticket #8.</div></div></div><div class="dialog-actions"><button type="button" data-action="close-dialog">Cancel</button><button class="primary" type="submit">Save item</button></div></form>`)}
function adjustStock(id){const s=stock.find(s=>s.id===id);openDialog('Adjust stock',`${s.name} · currently ${s.qty.toLocaleString('en')} ${s.unit}`,`<form id="stock-form" data-id="${id}" novalidate><div id="form-error" class="form-error" role="alert"></div><div class="form-grid"><label class="field"><span>Adjustment</span><select name="direction"><option value="1">Increase stock</option><option value="-1">Decrease stock</option></select></label><label class="field"><span>Quantity · ${s.unit}</span><input name="quantity" type="number" min="${s.unit==='each'?1:.001}" step="${s.unit==='each'?1:.001}" inputmode="decimal" required></label><label class="field full"><span>Reason</span><textarea name="reason" placeholder="For example, received a delivery" minlength="3" maxlength="500" required></textarea></label><p id="stock-preview" class="full" role="status">New balance: ${s.qty.toLocaleString('en')} ${s.unit}</p><p class="muted small full">This creates a demo stock movement and updates linked menu availability.</p></div><div class="dialog-actions"><button type="button" data-action="close-dialog">Cancel</button><button class="primary" type="submit">Apply adjustment</button></div></form>`)}
function checkout(){if(!online){notify('Reconnect before recording a sale.');return}const missing=shortage();if(missing){notify('Stock changed. Adjust the order before continuing.');return}openDialog('Record payment','A demo sale only. No money is collected.',`<form id="checkout-form" novalidate><div class="checkout-total"><span class="muted">Amount due</span><strong class="num">${money(total())}</strong></div><div id="form-error" class="form-error" role="alert"></div><div class="choice-list"><label class="choice"><input type="radio" name="payment" value="CASH" checked><span>Cash</span></label><label class="choice"><input type="radio" name="payment" value="MANUAL_EXTERNAL"><span>Manual external <span class="muted small">Already paid elsewhere</span></span></label></div><label class="field" id="cash-field"><span>Cash received · IDR</span><input name="tender" type="number" step="1" min="0" inputmode="numeric" value="${total()}"></label><label class="field" id="reference-field" hidden><span>Payment reference (optional)</span><input name="reference" maxlength="100"></label><p id="change-label" class="muted small" style="margin-top:12px">Change: ${money(0)}</p><div class="dialog-actions"><button type="button" data-action="close-dialog">Back to order</button><button class="primary" type="submit">Record demo sale</button></div></form>`)}
function showReceipt(sale){openDialog('Sale recorded',`${sale.reference} · ${sale.kind==='CASH'?'Cash':'Manual external'} · ${demoDate}`,`<div class="receipt-success" aria-hidden="true">✓</div><p class="muted" style="margin-bottom:16px">Stock and reports have updated in this demo.</p>${sale.lines.map(l=>`<div class="receipt-line"><span>${escapeHTML(l.name)} × ${l.qty}</span><strong class="num">${money(l.price*l.qty)}</strong></div>`).join('')}<div class="total-row big"><span>Total</span><span class="num">${money(sale.total)}</span></div>${sale.kind==='CASH'?`<div class="receipt-line"><span>Change</span><span class="num">${money(sale.change)}</span></div>`:'<p class="small muted">Recorded only. This prototype did not charge or verify a provider payment.</p>'}<div id="print-status" class="help-box" role="status">Receipt is ready. Print is simulated and separate from the sale.</div>`,`<button data-print-sale="${sale.id}">${sale.printed?'Reprint COPY':'Simulate receipt print'}</button><button class="primary" data-action="new-sale">New sale</button>`)}
function formError(message,field){$('#form-error').textContent=message;if(field){field.setAttribute('aria-invalid','true');field.setAttribute('aria-describedby','form-error');field.focus()}}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;if(b.dataset.page){navigate(b.dataset.page)}else if(b.dataset.category){category=b.dataset.category;render()}else if(b.dataset.product)chooseProduct(b.dataset.product);else if(b.dataset.variant){closeDialog();addVariant(b.dataset.variant)}else if(b.dataset.qty){const l=cart.find(l=>l.variantId===b.dataset.qty);l.qty+=Number(b.dataset.delta);if(l.qty===0)cart=cart.filter(x=>x!==l);if(shortage()){l.qty--;notify('Not enough stock for that quantity.')}render()}else if(b.dataset.remove){cart=cart.filter(l=>l.variantId!==b.dataset.remove);render()}else if(b.dataset.edit)editMenu(b.dataset.edit);else if(b.dataset.adjust)adjustStock(b.dataset.adjust);else if(b.dataset.receipt)showReceipt(sales.find(s=>s.id===b.dataset.receipt));else if(b.dataset.printSale){const sale=sales.find(s=>s.id===b.dataset.printSale);if(!printer.ready||printer.fail){$('#print-status').textContent='Simulated print failed. The sale is still recorded. Configure the printer and retry as COPY.';printer.ready=false;b.textContent='Retry as COPY'}else{sale.printed=true;$('#print-status').textContent='Simulated receipt sent. Physical printing is not connected.';b.textContent='Reprint COPY'}}else if(b.dataset.action){switch(b.dataset.action){case'review-order':document.querySelector('#current-order').scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});document.querySelector('#current-order').focus({preventScroll:true});break;case'checkout':checkout();break;case'close-dialog':closeDialog();break;case'new-sale':closeDialog();render();break;case'ready':screenState='ready';$('#screen-state').value='ready';render();break;case'test-print':printer.ready=!printer.fail;render();notify(printer.ready?'Simulated test print sent. No real printer was contacted.':'Simulated connection failed. Check the printer and try again.');break;case'export':{const rows=[['Reference','Date','Payment','Total IDR'],...sales.filter(s=>s.date===reportDate).map(s=>[s.reference,s.date,s.kind,s.total])];const csv=rows.map(row=>row.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\r\n');const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));link.download='modern-pos-demo-sales.csv';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),500);notify('Demo sales exported.');break}}}});
function updateStockPreview(){const form=$('#stock-form');if(!form)return;const s=stock.find(s=>s.id===form.dataset.id),n=s.qty+Number(form.elements.quantity.value)*Number(form.elements.direction.value);$('#stock-preview').textContent='New balance: '+n.toLocaleString('en')+' '+s.unit}
document.addEventListener('input',event=>{if(event.target.name==='quantity')updateStockPreview();if(event.target.id==='search'){search=event.target.value;const position=event.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(position,position)}if(event.target.name==='tender')$('#change-label').textContent='Change: '+money(Math.max(0,Number(event.target.value)-total()))});
document.addEventListener('change',event=>{if(event.target.id==='text-scale'){document.documentElement.style.setProperty('--text-scale',event.target.value);document.body.classList.toggle('large-text',Number(event.target.value)>1)}if(event.target.name==='direction')updateStockPreview();if(event.target.id==='report-date'){reportDate=event.target.value||demoDate;render()}if(event.target.id==='screen-state'){screenState=event.target.value;render()}if(event.target.id==='connection'){online=event.target.value==='online';render()}if(event.target.id==='print-fail')printer.fail=event.target.checked;if(event.target.name==='payment'){const cash=event.target.value==='CASH';$('#cash-field').hidden=!cash;$('#reference-field').hidden=cash;$('#change-label').hidden=!cash}});
document.addEventListener('submit',event=>{event.preventDefault();const form=event.target,data=new FormData(form);if(form.id==='menu-form'){const p=products.find(p=>p.id===form.dataset.id);const name=String(data.get('name')).trim();if(!name)return formError('Enter an item name.',form.elements.name);for(const v of p.variants){const raw=data.get('price-'+v.id),n=Number(raw);if(raw===''||!Number.isSafeInteger(n)||n<0||n>100000000)return formError('Enter a whole IDR price between 0 and 100,000,000.',form.elements['price-'+v.id])}p.name=name;p.category=String(data.get('category'));p.variants.forEach(v=>v.price=Number(data.get('price-'+v.id)));closeDialog();render();notify('Menu item updated.')}else if(form.id==='stock-form'){const s=stock.find(s=>s.id===form.dataset.id),raw=data.get('quantity'),q=Number(raw),delta=q*Number(data.get('direction')),reason=String(data.get('reason')).trim();if(raw===''||!Number.isFinite(q)||q<=0||q>1000000||s.unit==='each'&&!Number.isInteger(q))return formError('Enter a valid positive quantity in the displayed unit.',form.elements.quantity);if(s.qty+delta<0)return formError('This adjustment would make stock negative.',form.elements.quantity);if(reason.length<3)return formError('Add a reason with at least 3 characters.',form.elements.reason);s.qty=Number((s.qty+delta).toFixed(3));movements.push({name:s.name,delta,unit:s.unit,reason});closeDialog();render();notify('Stock updated. Linked menu availability is refreshed.')}else if(form.id==='checkout-form'){if(!online)return formError('Reconnect before recording this sale.');if(shortage())return formError('Not enough linked stock. Return to the order and adjust quantities.');const kind=data.get('payment'),raw=data.get('tender'),tender=Number(raw),amount=total();if(kind==='CASH'&&(raw===''||!Number.isSafeInteger(tender)||tender<amount))return formError('Cash received must cover the total.',form.elements.tender);const sale={date:demoDate,id:'demo-'+receiptSequence,reference:'DEMO-'+String(receiptSequence++).padStart(4,'0'),total:amount,kind,change:kind==='CASH'?tender-amount:0,lines:cart.map(l=>{const{p,v}=variant(l.variantId);return{name:p.name,price:v.price,qty:l.qty}}),printed:false};Object.entries(demand()).forEach(([id,q])=>{const s=stock.find(s=>s.id===id);s.qty-=q;movements.push({name:s.name,delta:-q,unit:s.unit,reason:sale.reference})});sales.push(sale);cart=[];closeDialog();render();showReceipt(sale)}else if(form.id==='printer-form'){if(!form.reportValidity())return;printer.name=String(data.get('printerName')).trim();printer.model=String(data.get('model')).trim();printer.transport=String(data.get('transport'));printer.width=String(data.get('width'));printer.ready=false;render();notify('Demo printer settings saved. Run a simulated test next.')}});
$('#dialog').addEventListener('cancel',()=>{setTimeout(()=>{if(lastOpener&&lastOpener.isConnected)lastOpener.focus();else $('#main').focus()},0)});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&!$('#dialog').open&&$('#search')){e.preventDefault();$('#search').focus()}});
document.querySelector('.tools-icon').innerHTML=icon('sliders-horizontal');
const reviewTools=document.querySelector('.review-tools');
reviewTools.addEventListener('focusout',event=>{if(event.relatedTarget&&!reviewTools.contains(event.relatedTarget))reviewTools.open=false});
document.addEventListener('click',event=>{if(reviewTools.open&&!reviewTools.contains(event.target))reviewTools.open=false});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&reviewTools.open&&!document.querySelector('dialog').open){reviewTools.open=false;reviewTools.querySelector('summary').focus()}});
render();
</script>
</body>
</html>
