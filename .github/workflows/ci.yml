name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, type, build, contract and Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos_local_dev
          POSTGRES_DB: modern_pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos -d modern_pos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pos:pos_local_dev@localhost:5432/modern_pos?schema=public
      PORT: '4000'
      WEB_ORIGIN: http://localhost:3000,http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @modern-pos/api prisma:generate

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: API unit tests
        run: pnpm test

      - name: API build
        run: pnpm --filter @modern-pos/api build

      - name: Apply Prisma migrations
        run: pnpm --filter @modern-pos/api exec prisma migrate deploy

      - name: Seed synthetic data twice
        run: |
          pnpm --filter @modern-pos/api seed
          pnpm --filter @modern-pos/api seed

      - name: API health check
        run: |
          (cd apps/api && node dist/main.js > /tmp/api.log 2>&1 & echo $! > /tmp/api.pid)
          curl -fsS --retry 20 --retry-delay 1 --retry-connrefused http://localhost:4000/health
          kill "$(cat /tmp/api.pid)"

      - name: Next.js build
        run: pnpm --filter @modern-pos/web build

      - name: OpenAPI validation, generation and drift check
        run: pnpm openapi:check

      - name: Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Flutter format check
        working-directory: apps/mobile
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Flutter analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Flutter tests
        working-directory: apps/mobile
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # sqlite3's build hook downloads pre-compiled native assets from GitHub
          # and verifies them against hashes pinned in the package. A corrupted
          # response makes the hook fail with:
          #   Hash of downloaded file libsqlite3.*.so is ..., expected ...
          #   Building assets for package:sqlite3 failed.
          # Prefetch the host asset through the GitHub API and verify it before
          # the hook runs. If the hook still fails, invalidate only the sqlite3
          # caches and retry once. Real test failures are not retried.
          pub_cache="${PUB_CACHE:-$HOME/.pub-cache}"
          prefetch_script="$GITHUB_WORKSPACE/.github/scripts/prefetch-sqlite3-assets.sh"

          bash "$prefetch_script" linux

          max_attempts=2
          attempt=1
          while true; do
            echo "::group::flutter test (attempt ${attempt}/${max_attempts})"
            if flutter test 2>&1 | tee /tmp/flutter-test.log; then
              echo "::endgroup::"
              exit 0
            else
              status=${PIPESTATUS[0]}
              echo "::endgroup::"
            fi

            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "flutter test failed after ${max_attempts} attempts" >&2
              exit "$status"
            fi

            if ! grep -qE 'Hash of downloaded file .* expected|Building assets for package:sqlite3 failed' /tmp/flutter-test.log; then
              echo "flutter test failed for a reason other than a corrupted sqlite3 download; not retrying" >&2
              exit "$status"
            fi

            echo "Detected corrupted sqlite3 native asset download; invalidating cached artifact and retrying"
            rm -rf "${pub_cache}"/hosted/pub.dev/sqlite3-*
            rm -rf .dart_tool/hooks_runner/shared/sqlite3 .dart_tool/hooks_runner/sqlite3 build/native_assets
            flutter pub get
            bash "$prefetch_script" linux
            attempt=$((attempt + 1))
          done

      - name: Ensure Android SDK 36 and NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Android debug build
        working-directory: apps/mobile
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Two GitHub-hosted downloads can fail transiently before any project
          # code runs: the Gradle wrapper distribution and the sqlite3 Android
          # native assets. Prefetch and verify the assets, then retry once when
          # either download is corrupt/5xx. Real build failures are not retried.
          pub_cache="${PUB_CACHE:-$HOME/.pub-cache}"
          gradle_dist="$HOME/.gradle/wrapper/dists/gradle-9.3.1-all"
          prefetch_script="$GITHUB_WORKSPACE/.github/scripts/prefetch-sqlite3-assets.sh"

          bash "$prefetch_script" android

          max_attempts=2
          attempt=1
          while true; do
            echo "::group::flutter build apk --debug (attempt ${attempt}/${max_attempts})"
            if flutter build apk --debug 2>&1 | tee /tmp/android-build.log; then
              echo "::endgroup::"
              exit 0
            else
              status=${PIPESTATUS[0]}
              echo "::endgroup::"
            fi

            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Android debug build failed after ${max_attempts} attempts" >&2
              exit "$status"
            fi

            if grep -qE 'Hash of downloaded file .* expected|Building assets for package:sqlite3 failed' /tmp/android-build.log; then
              echo "Detected corrupted sqlite3 Android native asset download; invalidating cached artifacts and retrying"
              rm -rf "${pub_cache}"/hosted/pub.dev/sqlite3-*
              rm -rf .dart_tool/hooks_runner/shared/sqlite3 .dart_tool/hooks_runner/sqlite3 build/native_assets
              flutter pub get
              bash "$prefetch_script" android
            elif grep -qE 'Server returned HTTP response code: 5[0-9][0-9] for URL: https://github.com/gradle/gradle-distributions/|Could not (GET|HEAD) .*services\.gradle\.org|Could not download gradle-9\.3\.1-all\.zip' /tmp/android-build.log; then
              echo "Detected transient Gradle distribution download failure; clearing the wrapper cache and retrying"
              rm -rf "$gradle_dist"
            else
              echo "Android debug build failed for a reason other than a transient download; not retrying" >&2
              exit "$status"
            fi
            attempt=$((attempt + 1))
          done
