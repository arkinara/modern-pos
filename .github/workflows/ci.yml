name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, type, build, contract and Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos_local_dev
          POSTGRES_DB: modern_pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos -d modern_pos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pos:pos_local_dev@localhost:5432/modern_pos?schema=public
      PORT: '4000'
      WEB_ORIGIN: http://localhost:3000,http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @modern-pos/api prisma:generate

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: API unit tests
        run: pnpm test

      - name: API build
        run: pnpm --filter @modern-pos/api build

      - name: Apply Prisma migrations
        run: pnpm --filter @modern-pos/api exec prisma migrate deploy

      - name: Seed synthetic data twice
        run: |
          pnpm --filter @modern-pos/api seed
          pnpm --filter @modern-pos/api seed

      - name: API health check
        run: |
          (cd apps/api && node dist/main.js > /tmp/api.log 2>&1 & echo $! > /tmp/api.pid)
          curl -fsS --retry 20 --retry-delay 1 --retry-connrefused http://localhost:4000/health
          kill "$(cat /tmp/api.pid)"

      - name: Next.js build
        run: pnpm --filter @modern-pos/web build

      - name: OpenAPI validation, generation and drift check
        run: pnpm openapi:check

      - name: Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Flutter format check
        working-directory: apps/mobile
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Flutter analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Flutter tests
        working-directory: apps/mobile
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # sqlite3's build hook downloads a pre-compiled native asset from GitHub
          # and verifies it against a hash pinned in the package. A transient
          # truncated/aborted download makes that verification fail with:
          #   Hash of downloaded file libsqlite3.*.so is ..., expected ...
          #   Building assets for package:sqlite3 failed.
          # We therefore prefetch the asset through the GitHub API (a different
          # endpoint than the release download the hook uses) and verify its
          # SHA-256 before the hook sees it. If the hook still fails on a corrupt
          # download, we invalidate only the sqlite3 caches and retry once. Real
          # test failures are not retried.
          sqlite3_version=3.5.2
          pub_cache="${PUB_CACHE:-$HOME/.pub-cache}"

          prefetch_sqlite3_asset() {
            local machine asset hash prefix dir tmpdir attempt got

            machine="$(uname -m)"
            case "$machine" in
              x86_64|amd64)
                asset=libsqlite3.x64.linux.so
                hash=b17729184e5a2818055ecbddd5ed6642521bfe6e56aafa472330e483c0e2e0d2
                ;;
              aarch64|arm64)
                asset=libsqlite3.arm64.linux.so
                hash=7f0db19fdb987298ab8def51431aba5cec28a81685e8b62cebbc7402df090a16
                ;;
              *)
                echo "No verified sqlite3 prefetch rule for architecture $machine; falling back to the hook download"
                return 0
                ;;
            esac

            prefix="${hash:0:8}"
            dir=".dart_tool/hooks_runner/shared/sqlite3/build/download-${prefix}"
            if [ -f "$dir/libsqlite3.so" ] && [ "$(sha256sum "$dir/libsqlite3.so" | cut -d' ' -f1)" = "$hash" ]; then
              echo "Verified sqlite3 native asset already cached"
              return 0
            fi

            tmpdir="$(mktemp -d)"
            for attempt in 1 2 3; do
              rm -f "$tmpdir/$asset"
              if gh release download "sqlite3-${sqlite3_version}" \
                  --repo simolus3/sqlite3.dart \
                  --pattern "$asset" \
                  --dir "$tmpdir" \
                  --clobber; then
                got="$(sha256sum "$tmpdir/$asset" | cut -d' ' -f1)"
                if [ "$got" = "$hash" ]; then
                  mkdir -p "$dir"
                  cp "$tmpdir/$asset" "$dir/libsqlite3.so"
                  rm -rf "$tmpdir"
                  echo "Prefetched and verified ${asset} (${hash})"
                  return 0
                fi
                echo "Prefetch attempt ${attempt} for ${asset} had hash ${got}; expected ${hash}" >&2
              else
                echo "Prefetch attempt ${attempt} for ${asset} failed to download" >&2
              fi
              sleep 5
            done
            rm -rf "$tmpdir"
            echo "Could not prefetch a verified ${asset}; falling back to the hook download" >&2
            return 0
          }

          prefetch_sqlite3_asset

          max_attempts=2
          attempt=1
          while true; do
            echo "::group::flutter test (attempt ${attempt}/${max_attempts})"
            if flutter test 2>&1 | tee /tmp/flutter-test.log; then
              echo "::endgroup::"
              exit 0
            else
              status=${PIPESTATUS[0]}
              echo "::endgroup::"
            fi

            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "flutter test failed after ${max_attempts} attempts" >&2
              exit "$status"
            fi

            if ! grep -qE 'Hash of downloaded file .* expected|Building assets for package:sqlite3 failed' /tmp/flutter-test.log; then
              echo "flutter test failed for a reason other than a corrupted sqlite3 download; not retrying" >&2
              exit "$status"
            fi

            echo "Detected corrupted sqlite3 native asset download; invalidating cached artifact and retrying"
            rm -rf "${pub_cache}"/hosted/pub.dev/sqlite3-*
            rm -rf .dart_tool/hooks_runner/shared/sqlite3 .dart_tool/hooks_runner/sqlite3 build/native_assets
            flutter pub get
            prefetch_sqlite3_asset
            attempt=$((attempt + 1))
          done

      - name: Ensure Android SDK 36 and NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Android debug build
        working-directory: apps/mobile
        run: flutter build apk --debug
