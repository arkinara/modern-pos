name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, type, build, contract and Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos_local_dev
          POSTGRES_DB: modern_pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos -d modern_pos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pos:pos_local_dev@localhost:5432/modern_pos?schema=public
      PORT: '4000'
      WEB_ORIGIN: http://localhost:3000,http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @modern-pos/api prisma:generate

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: API unit tests
        run: pnpm test

      - name: API build
        run: pnpm --filter @modern-pos/api build

      - name: Apply Prisma migrations
        run: pnpm --filter @modern-pos/api exec prisma migrate deploy

      - name: Seed synthetic data twice
        run: |
          pnpm --filter @modern-pos/api seed
          pnpm --filter @modern-pos/api seed

      - name: API health check
        run: |
          (cd apps/api && node dist/main.js > /tmp/api.log 2>&1 & echo $! > /tmp/api.pid)
          curl -fsS --retry 20 --retry-delay 1 --retry-connrefused http://localhost:4000/health
          kill "$(cat /tmp/api.pid)"

      - name: Next.js build
        run: pnpm --filter @modern-pos/web build

      - name: OpenAPI validation, generation and drift check
        run: pnpm openapi:check

      - name: Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Flutter format check
        working-directory: apps/mobile
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Flutter analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Flutter tests
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          # sqlite3's build hook downloads a pre-compiled native asset from GitHub
          # and verifies it against a hash pinned in the package. A transient
          # truncated/aborted download makes that verification fail with:
          #   Hash of downloaded file libsqlite3.*.so is ..., expected ...
          #   Building assets for package:sqlite3 failed.
          # Retry once after invalidating only the sqlite3 download so that a
          # corrupted transfer cannot fail CI on its own. Real test failures are
          # not retried.
          pub_cache="${PUB_CACHE:-$HOME/.pub-cache}"
          max_attempts=2
          attempt=1
          while true; do
            echo "::group::flutter test (attempt ${attempt}/${max_attempts})"
            if flutter test 2>&1 | tee /tmp/flutter-test.log; then
              echo "::endgroup::"
              exit 0
            else
              status=${PIPESTATUS[0]}
              echo "::endgroup::"
            fi

            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "flutter test failed after ${max_attempts} attempts" >&2
              exit "$status"
            fi

            if ! grep -qE 'Hash of downloaded file .* expected|Building assets for package:sqlite3 failed' /tmp/flutter-test.log; then
              echo "flutter test failed for a reason other than a corrupted sqlite3 download; not retrying" >&2
              exit "$status"
            fi

            echo "Detected corrupted sqlite3 native asset download; invalidating cached artifact and retrying"
            rm -rf "${pub_cache}"/hosted/pub.dev/sqlite3-*
            rm -rf .dart_tool/hooks_runner/shared/sqlite3 .dart_tool/hooks_runner/sqlite3 build/native_assets
            flutter pub get
            attempt=$((attempt + 1))
          done

      - name: Ensure Android SDK 36 and NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Android debug build
        working-directory: apps/mobile
        run: flutter build apk --debug
