services:
  postgres:
    image: postgres:17.6-alpine
    container_name: modern-pos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos_local_dev
      POSTGRES_DB: modern_pos
    ports:
      - '5432:5432'
    volumes:
      - modern_pos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pos -d modern_pos']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  modern_pos_pgdata:
